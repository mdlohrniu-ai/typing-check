<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Drill</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;
  --card:#fffdf8;
  --ink:#1a1208;
  --ink-soft:#6b5f4a;
  --accent:#c84b2f;
  --accent-light:#f5ddd8;
  --border:#e0d5c0;
  --green:#3a7d44;
  --green-light:#d4ead8;
  --red:#c0392b;
  --red-light:#fde8e6;
  --hint:#888;
  --blank:#ccc;
  --mono:'Courier New',monospace;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 20% 20%,rgba(200,75,47,.06) 0%,transparent 50%),
                   radial-gradient(circle at 80% 80%,rgba(212,168,71,.08) 0%,transparent 50%);}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.screen.active{display:flex}

/* ── LOGIN ── */
#login{gap:1.5rem;text-align:center}
.logo{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--ink)}
.logo span{color:var(--accent);font-style:italic}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem 2.5rem;width:100%;max-width:360px;display:flex;flex-direction:column;gap:1.25rem}
.login-card label{font-size:.8rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.3rem;display:block}
.login-card input{width:100%;font-size:1.1rem;padding:.65rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink);outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:.75rem 2rem;font-size:1rem;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:opacity .2s;width:100%}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error-msg{font-size:.85rem;color:var(--red);min-height:18px;text-align:center}
.loading-msg{font-size:.85rem;color:var(--ink-soft);text-align:center;min-height:18px}

/* ── NO WORDS ── */
#no-words{gap:1rem;text-align:center}
#no-words h2{font-family:'DM Serif Display',serif;font-size:1.8rem}
#no-words p{color:var(--ink-soft);max-width:340px;line-height:1.6}

/* ── DRILL ── */
#drill{gap:0;align-items:stretch;padding:0}
.drill-header{background:var(--card);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;width:100%}
.drill-header-name{font-size:.85rem;color:var(--ink-soft)}
.drill-header-progress{font-size:.85rem;color:var(--ink-soft)}
.drill-body{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem;width:100%}
.drill-inner{width:100%;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:0;outline:none}

/* progress bar */
.prog-wrap{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.prog-track{flex:1;height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.prog-lbl{font-size:.75rem;color:var(--ink-soft);white-space:nowrap}

/* stage label */
.stage-lbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:1rem}

/* mascot + content side by side */
.drill-row{display:flex;align-items:flex-end;gap:14px;justify-content:center;margin-bottom:1.5rem;width:100%}
.mascot-wrap{flex-shrink:0;width:48px;display:flex;flex-direction:column;align-items:center;gap:4px}
#mascot-canvas{image-rendering:pixelated;image-rendering:crisp-edges;width:48px;height:72px}
#speech{font-size:10px;color:var(--ink-soft);text-align:center;min-height:12px;line-height:1.2;font-family:'DM Sans',sans-serif}

/* letter tiles */
.letter-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:flex-end;flex:1}
.cell{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;width:44px}
.cell-top{height:50px;display:flex;align-items:center;justify-content:center;position:relative;width:100%}
.cell-char{font-size:34px;font-weight:500;font-family:var(--mono);color:var(--ink);line-height:1;transition:color .1s}
.cell-char.hint{color:var(--hint)}
.cell-char.correct{color:var(--green)}
.cell-char.wrong{color:var(--red)}
.cell-char.blank{color:var(--blank)}
.cell-ul{width:34px;height:2px;border-radius:1px;background:var(--border)}
.cell-ul.active{background:var(--ink)}
.v-cur{position:absolute;left:1px;top:5px;width:2px;height:40px;background:var(--ink);border-radius:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.v-cur{animation:blink .9s step-start infinite}

/* sentence tiles */
.sent-block{flex:1;display:flex;flex-direction:column;gap:6px}
.sent-line{display:flex;gap:3px;flex-wrap:nowrap;justify-content:center;align-items:flex-end}
.sc{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.sc-char{font-size:19px;font-family:var(--mono);color:var(--ink);line-height:1;min-width:11px;text-align:center}
.sc-char.correct{color:var(--green)}
.sc-char.wrong{color:var(--red)}
.sc-char.blank{color:var(--blank)}
.sc-char.hint{color:var(--hint)}
.sc-ul{height:1.5px;border-radius:1px;background:var(--border);width:100%;min-width:11px}
.sc-ul.active{background:var(--ink)}
.sv-cur{position:absolute;left:-1px;top:0;width:1.5px;height:21px;background:var(--ink);border-radius:1px;animation:blink .9s step-start infinite}
.space-gap{width:8px;flex-shrink:0}

/* step dots */
.step-dots{display:flex;gap:8px;justify-content:center;margin-bottom:.75rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border);border:1px solid #ccc;transition:background .2s}
.dot.done{background:var(--green);border-color:var(--green)}
.dot.active{background:var(--accent);border-color:var(--accent)}

/* feedback */
.feedback{text-align:center;font-size:.8rem;min-height:16px;margin-bottom:.5rem;color:var(--ink-soft)}
.feedback.good{color:var(--green)}
.feedback.bad{color:var(--red)}

/* ── COMPLETE ── */
#complete{gap:1.5rem;text-align:center}
.complete-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;max-width:400px;width:100%;display:flex;flex-direction:column;align-items:center;gap:1rem}
.complete-card h2{font-family:'DM Serif Display',serif;font-size:2rem}
.complete-card p{color:var(--ink-soft);line-height:1.6;font-size:.95rem}
.badge-complete{background:var(--green);color:#fff;border-radius:99px;padding:.4rem 1.2rem;font-size:.8rem;font-weight:500;letter-spacing:.05em}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="login">
  <div class="logo">Spelling <span>Drill</span></div>
  <div class="login-card">
    <div>
      <label>Student Number</label>
      <input type="text" id="student-input" placeholder="e.g. 2611166" inputmode="numeric"
             onkeydown="if(event.key==='Enter')startLogin()">
    </div>
    <button class="btn" onclick="startLogin()">Start</button>
    <div class="error-msg" id="login-error"></div>
    <div class="loading-msg" id="login-loading"></div>
  </div>
</div>

<!-- NO WORDS -->
<div class="screen" id="no-words">
  <h2>No words yet!</h2>
  <p id="no-words-msg">You don't have any spelling words this week. Check back after your blog entry is marked.</p>
  <button class="btn" style="max-width:200px;margin-top:1rem" onclick="show('login')">Back</button>
</div>

<!-- DRILL -->
<div class="screen" id="drill">
  <div class="drill-header">
    <span class="drill-header-name" id="drill-name"></span>
    <span class="drill-header-progress" id="drill-prog-lbl"></span>
  </div>
  <div class="drill-body">
    <div class="drill-inner" id="drill-inner" tabindex="0">
      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
        <span class="prog-lbl" id="prog-lbl-inner"></span>
      </div>
      <div class="stage-lbl" id="stage-lbl"></div>
      <div class="drill-row" id="drill-row">
        <div class="mascot-wrap">
          <canvas id="mascot-canvas" width="12" height="21"></canvas>
          <div id="speech"></div>
        </div>
        <div id="main-row"></div>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="step-dots" id="dots"></div>
    </div>
  </div>
</div>

<!-- COMPLETE -->
<div class="screen" id="complete">
  <div class="complete-card">
    <div class="badge-complete">Complete</div>
    <h2>Well done!</h2>
    <p id="complete-msg"></p>
    <p id="complete-sub" style="font-size:.8rem;color:#aaa"></p>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw7pgeujRDwsV4U3v8hKpapECTNLw1LElK8i3FCzy0QXSU-yDnCCzwrHcmI-roAPj7fRw/exec';

// ── ROSTER (student# -> {name, class}) ──────────────────────────────────────
const ROSTER = {
  "2511003":{"name":"ABE GAITO","class":"EWSIII"},
  "2511004":{"name":"ABE FUCHI","class":"EWSIII"},
  "2511030":{"name":"UEHARA YUKI","class":"EWSIII"},
  "2511062":{"name":"KAWAMURA ATSUHA","class":"EWSIII"},
  "2511081":{"name":"SAKAMOTO AOI","class":"EWSIII"},
  "2511082":{"name":"SAZA SHIONE","class":"EWSIII"},
  "2511119":{"name":"NAKANO ATSUKI","class":"EWSIII"},
  "2511120":{"name":"NAKANO TAKUMI","class":"EWSIII"},
  "2511124":{"name":"NISHIDA KUGA","class":"EWSIII"},
  "2511125":{"name":"NISHIMURA NANA","class":"EWSIII"},
  "2511135":{"name":"HIGA MIHIRO","class":"EWSIII"},
  "2511168":{"name":"MILLS ALLEN THOMAS","class":"EWSIII"},
  "2611006":{"name":"ISHIGURI GAKUTO","class":"EWSI"},
  "2611019":{"name":"URA MIRYU","class":"EWSI"},
  "2611022":{"name":"OURA YUKI","class":"EWSI"},
  "2611084":{"name":"TAGE RINTARO","class":"EWSI"},
  "2611098":{"name":"NAKAO MAIKI","class":"EWSI"},
  "2611101":{"name":"NAKASHIMA SHIKI","class":"EWSI"},
  "2611107":{"name":"NAKANO RIKU","class":"EWSI"},
  "2611116":{"name":"NISHIMURA NORIYASU","class":"EWSI"},
  "2611117":{"name":"NISHIMURA MUSASHI","class":"EWSI"},
  "2611121":{"name":"NOMURA NAO","class":"EWSI"},
  "2611126":{"name":"HARASHIMA RARA","class":"EWSI"},
  "2611136":{"name":"BREWER NOA KOTA","class":"EWSI"},
  "2611153":{"name":"MARUTA HARUKA","class":"EWSI"},
  "2611159":{"name":"MIYAMOTO HITOMI","class":"EWSI"},
  "2611166":{"name":"MORI KANON","class":"EWSI"},
  "2600000":{"name":"LOHR MICHAEL","class":"EWSI"}
};

// ── WORD BANK (keyed by annotation name format: "LAST FIRST") ───────────────
// Maps roster English name (LAST FIRST) to word list
// Annotation names like "Kanon MORI" -> normalised to "MORI KANON"
const WORD_BANK_RAW = {"Kanon MORI": [{"word": "possession", "sentence": "Today I will talk about my favorite ___."},{"word": "useful", "sentence": "A smartphone is very ___ for us."}],"Maiki NAKAO": [{"word": "usually", "sentence": "I ___ make it when I find something that I like on Instagram."}],"Nao NOMURA": [{"word": "possession", "sentence": "My precious ___ is a soccer shoes."}],"Rara HARASHIMA": [{"word": "happiness", "sentence": "Sleeping is my greatest ___!!"}],"Yuki OURA": [{"word": "listening", "sentence": "I use it for watching many movies, ___ to music and playing some games."},{"word": "causes", "sentence": "It ___ bad effects on my health, so I want to use it suitably."}],"Hitomi MIYAMOTO": [{"word": "possession", "sentence": "Today, I'm talking about my favorite ___ (thing)!!"},{"word": "Classical", "sentence": "Rock, K-POP, J-POP, Jazz, ___, etc...."},{"word": "recommended", "sentence": "What is your favorite (___) song?"}],"Musashi NISHIMURA": [{"word": "pleased", "sentence": "Then I was very ___!"},{"word": "forever", "sentence": "Perhaps, I would use the wallet ___!"}],"Shiki NAKASHIMA": [{"word": "smartphone", "sentence": "Because a ___ can play these."}],"Riku NAKANO": [{"word": "possession", "sentence": "My favorite ___ is clothes."},{"word": "memories", "sentence": "I will never forget these ___."}],"Miryu URA": [{"word": "Expensive", "sentence": "___ fashion items are very cool and I love them."}],"Haruka MARUTA": [{"word": "packages", "sentence": "There are many kinds of AQUA sunblock such as purple, green and pink ___."},{"word": "package", "sentence": "I am using the green ___."},{"word": "recommend", "sentence": "I ___ AQUA in the green package."},{"word": "useful", "sentence": "It will be ___ for summer!"},{"word": "measure", "sentence": "Do you do ___ sunblock?"}]};

// Normalise annotation name "First LAST" -> "LAST FIRST"
function normAnnotName(n){
  const p=n.trim().split(/\s+/);
  if(p.length<2)return n.toUpperCase();
  const last=p[p.length-1].toUpperCase();
  const first=p.slice(0,-1).map(w=>w.toUpperCase()).join(' ');
  return last+' '+first;
}

const WORD_BANK = {};
for(const[k,v] of Object.entries(WORD_BANK_RAW)){
  WORD_BANK[normAnnotName(k)] = v;
}

// ── STATE ───────────────────────────────────────────────────────────────────
let studentNum='', studentName='', studentClass='', wordList=[], wi=0, si=0, pos=0, mistakes=0;
const STAGES=['full','half','none','sentence'];
const STAGE_LABELS=['Study this word — type every letter','Some letters shown — type every letter','Spell it from memory','Type the full sentence'];
const MAX_WORDS = 5;

// ── HELPERS ─────────────────────────────────────────────────────────────────
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function setFb(msg,cls=''){const f=document.getElementById('fb');f.textContent=msg;f.className='feedback'+(cls?' '+cls:'');}

// ── LOGIN ────────────────────────────────────────────────────────────────────
function startLogin(){
  const num = document.getElementById('student-input').value.trim();
  const errEl = document.getElementById('login-error');
  const ldEl  = document.getElementById('login-loading');
  errEl.textContent='';

  if(!num){errEl.textContent='Please enter your student number.';return;}
  if(!ROSTER[num]){errEl.textContent='Student number not found. Please check and try again.';return;}

  studentNum   = num;
  studentName  = ROSTER[num].name;
  studentClass = ROSTER[num].class;

  // Look up word bank by normalised name
  const words = WORD_BANK[studentName] || [];
  if(words.length===0){
    document.getElementById('no-words-msg').textContent =
      `Hi ${studentName}! You don't have any spelling words yet this week. Check back after your blog entry has been marked.`;
    show('no-words');
    return;
  }

  // Shuffle and take up to MAX_WORDS
  const shuffled = [...words].sort(()=>Math.random()-.5);
  wordList = shuffled.slice(0, MAX_WORDS);
  wi=0; si=0; pos=0; mistakes=0;

  document.getElementById('drill-name').textContent = studentName + ' · ' + studentClass;
  show('drill');
  renderStage();
  document.getElementById('drill-inner').focus();
}

// ── PIXEL MASCOT ─────────────────────────────────────────────────────────────
const mCanvas=document.getElementById('mascot-canvas');
const mCtx=mCanvas.getContext('2d');
const speech=document.getElementById('speech');

const SK='#F0C080',HR='#2A1A08',SU='#2255AA',SD='#1A3D7A',VS='#1A3060',VSD='#0F1F40',
      SH='#EEEEEE',TI='#CC2222',TID='#881111',GL='#111111',EY='#111111',LN='#D8EEF8',MH='#B05040',NN='';

function cl(){mCtx.clearRect(0,0,12,21);}
function px(x,y,c){if(!c||c===NN)return;mCtx.fillStyle=c;mCtx.fillRect(x,y,1,1);}
function row(y,a){a.forEach((c,x)=>px(x,y,c));}

function glasses(y,smiling){
  px(2,y,LN);px(3,y,LN);px(2,y+1,LN);px(3,y+1,LN);
  px(7,y,LN);px(8,y,LN);px(7,y+1,LN);px(8,y+1,LN);
  px(1,y,GL);px(2,y,GL);px(3,y,GL);px(4,y,GL);
  px(1,y+1,GL);px(4,y+1,GL);
  px(1,y+2,GL);px(2,y+2,GL);px(3,y+2,GL);px(4,y+2,GL);
  px(5,y+1,GL);
  px(6,y,GL);px(7,y,GL);px(8,y,GL);px(9,y,GL);
  px(6,y+1,GL);px(9,y+1,GL);
  px(6,y+2,GL);px(7,y+2,GL);px(8,y+2,GL);px(9,y+2,GL);
  if(smiling){px(2,y+1,EY);px(3,y,EY);px(7,y+1,EY);px(8,y,EY);}
  else{px(2,y+1,EY);px(8,y+1,EY);}
}

function drawBase(mouth,arms,b=0){
  cl();
  row(0+b,[NN,NN,HR,HR,HR,HR,HR,HR,HR,NN,NN,NN]);
  row(1+b,[NN,HR,SK,SK,SK,SK,SK,SK,SK,HR,NN,NN]);
  row(2+b,[NN,HR,SK,SK,SK,SK,SK,SK,SK,HR,NN,NN]);
  glasses(3+b,mouth==='smile');
  px(2,3+b,LN);px(3,3+b,LN);px(7,3+b,LN);px(8,3+b,LN);
  px(2,4+b,LN);px(3,4+b,LN);px(7,4+b,LN);px(8,4+b,LN);
  row(6+b,[NN,NN,SK,SK,SK,SK,SK,SK,SK,NN,NN,NN]);
  if(mouth==='neutral'){row(7+b,[NN,NN,SK,SK,MH,MH,MH,SK,SK,NN,NN,NN]);}
  else if(mouth==='smile'){row(7+b,[NN,NN,MH,SK,SK,SK,SK,SK,MH,NN,NN,NN]);row(8+b,[NN,NN,SK,MH,MH,MH,MH,MH,SK,NN,NN,NN]);}
  else{row(7+b,[NN,NN,SK,MH,SK,SK,SK,MH,SK,NN,NN,NN]);row(8+b,[NN,NN,MH,SK,SK,SK,SK,SK,MH,NN,NN,NN]);}
  row(9+b,[NN,NN,SK,SK,SK,SK,SK,SK,SK,NN,NN,NN]);
  row(10,[NN,NN,SU,SH,SH,SH,SH,SH,SU,NN,NN,NN]);
  px(5,10,TID);px(6,10,TID);
  for(let y=11;y<=18;y++){
    px(1,y,SU);px(2,y,SD);px(9,y,SU);px(8,y,SD);
    px(3,y,VS);px(4,y,VSD);px(7,y,VS);px(6,y,VSD);
    px(5,y,y<=15?TI:SH);
    if(y===13)px(5,y,TID);
  }
  px(2,11,SH);px(3,11,SH);px(8,11,SH);px(7,11,SH);px(2,12,SH);px(8,12,SH);
  row(19,[NN,SU,SD,VS,VSD,SH,TI,VSD,VS,SD,SU,NN]);
  arms.forEach(([x,y,c])=>px(x,y,c));
  row(20,[NN,NN,NN,SD,SD,NN,NN,SD,SD,NN,NN,NN]);
  row(21,[NN,NN,NN,SD,SD,NN,NN,SD,SD,NN,NN,NN]);
  row(22,[NN,NN,NN,SD,SD,NN,NN,SD,SD,NN,NN,NN]);
  row(23,[NN,NN,HR,HR,HR,NN,NN,HR,HR,HR,NN,NN]);
  row(24,[NN,NN,HR,HR,HR,NN,NN,HR,HR,HR,NN,NN]);
}

const ARMS_IDLE=[[0,12,SU],[0,13,SU],[0,14,SK],[0,15,SK],[10,12,SU],[10,13,SU],[10,14,SK],[10,15,SK]];
const ARMS_UP_A=[[0,8,SK],[0,9,SK],[1,10,SU],[10,8,SK],[10,9,SK],[11,10,SU]];
const ARMS_UP_B=[[0,7,SK],[0,8,SK],[1,9,SU],[10,7,SK],[10,8,SK],[11,9,SU]];
const ARMS_SAD=[[0,13,SU],[0,14,SU],[0,15,SK],[10,13,SU],[10,14,SU],[10,15,SK]];

function drawIdle(){drawBase('neutral',ARMS_IDLE);}
function drawCheer(f){drawBase('smile',f%2===0?ARMS_UP_A:ARMS_UP_B);if(f%2===0){px(5,0,'#F5C518');px(4,0,'#F5C518');}}
function drawSad(){drawBase('sad',ARMS_SAD);}

let cheerTimer=null,cheerFrame=0,cheerCount=0;
function startCheer(msg){
  speech.textContent=msg||'';
  if(cheerTimer)clearInterval(cheerTimer);
  cheerCount=0;cheerFrame=0;
  cheerTimer=setInterval(()=>{
    drawCheer(cheerFrame++);
    if(++cheerCount>16){clearInterval(cheerTimer);cheerTimer=null;drawIdle();speech.textContent='';}
  },110);
}
function showSad(){drawSad();setTimeout(()=>drawIdle(),550);}
drawIdle();

// ── DRILL LOGIC ──────────────────────────────────────────────────────────────
const mainRow=document.getElementById('main-row');
const dots=document.getElementById('dots');

function renderDots(){
  dots.innerHTML=STAGES.slice(0,-1).map((_,i)=>{
    let c='dot';
    if(i<si)c+=' done';
    else if(i===si)c+=' active';
    return`<div class="${c}"></div>`;
  }).join('');
}

function shakeRow(){
  mainRow.style.transform='translateX(-5px)';
  setTimeout(()=>mainRow.style.transform='translateX(5px)',70);
  setTimeout(()=>mainRow.style.transform='translateX(-3px)',140);
  setTimeout(()=>mainRow.style.transform='translateX(0)',210);
}

function getVis(word,stage){
  if(stage==='full')return word.split('').map(()=>true);
  if(stage==='half')return word.split('').map((_,i)=>i%2===0);
  return word.split('').map(()=>false);
}

function buildWordRow(word,stage){
  const vis=getVis(word,stage);
  mainRow.innerHTML='';
  const r=document.createElement('div');r.className='letter-row';
  word.split('').forEach((ch,i)=>{
    const cell=document.createElement('div');cell.className='cell';
    const top=document.createElement('div');top.className='cell-top';
    if(i===pos){const cur=document.createElement('div');cur.className='v-cur';top.appendChild(cur);}
    const span=document.createElement('div');
    span.className='cell-char '+(vis[i]?'hint':'blank');
    span.id='lc'+i;span.textContent=vis[i]?ch:'_';
    top.appendChild(span);
    const ul=document.createElement('div');ul.className='cell-ul'+(i===pos?' active':'');ul.id='lu'+i;
    cell.appendChild(top);cell.appendChild(ul);r.appendChild(cell);
  });
  mainRow.appendChild(r);
}

function buildSentenceRow(word,sentence){
  const parts=sentence.split('___');
  const before=parts[0]||'',after=parts[1]||'';
  const full=before+word+after;
  mainRow._full=full;mainRow._ts=before.length;mainRow._te=before.length+word.length;
  const CW=14,GAP=3,SW=8,MAX=390;
  const tokens=[];let buf='',bufStart=0;
  for(let i=0;i<full.length;i++){
    if(full[i]===' '){if(buf){tokens.push({type:'word',chars:buf.split('').map((ch,k)=>({ch,gi:bufStart+k,isTarget:(bufStart+k)>=mainRow._ts&&(bufStart+k)<mainRow._te}))});buf='';}tokens.push({type:'space',gi:i});bufStart=i+1;}
    else{if(!buf)bufStart=i;buf+=full[i];}
  }
  if(buf)tokens.push({type:'word',chars:buf.split('').map((ch,k)=>({ch,gi:bufStart+k,isTarget:(bufStart+k)>=mainRow._ts&&(bufStart+k)<mainRow._te}))});
  const lines=[];let curLine=[],curW=0;
  tokens.forEach(tok=>{
    if(tok.type==='space'){if(curLine.length>0){curLine.push(tok);curW+=SW+GAP;}}
    else{
      const w=tok.chars.length*(CW+GAP);
      if(curLine.length>0&&curW+w>MAX){if(curLine[curLine.length-1].type==='space')curLine.pop();lines.push(curLine);curLine=[];curW=0;}
      curLine.push(tok);curW+=w;
    }
  });
  if(curLine.length){if(curLine[curLine.length-1].type==='space')curLine.pop();lines.push(curLine);}
  mainRow.innerHTML='';
  const block=document.createElement('div');block.className='sent-block';
  lines.forEach(line=>{
    const ld=document.createElement('div');ld.className='sent-line';
    line.forEach(tok=>{
      if(tok.type==='space'){const g=document.createElement('div');g.className='space-gap';ld.appendChild(g);}
      else tok.chars.forEach(({ch,gi:g,isTarget})=>{
        const sc=document.createElement('div');sc.className='sc';
        if(g===pos){const cur=document.createElement('div');cur.className='sv-cur';sc.appendChild(cur);}
        const sp=document.createElement('div');sp.id='sc'+g;
        sp.className='sc-char '+(isTarget?'blank':'hint');sp.textContent=isTarget?'_':ch;
        const ul=document.createElement('div');ul.id='su'+g;ul.className='sc-ul';if(g===pos)ul.classList.add('active');
        sc.appendChild(sp);sc.appendChild(ul);ld.appendChild(sc);
      });
    });
    block.appendChild(ld);
  });
  mainRow.appendChild(block);
}

function moveCursorWord(word){
  document.querySelectorAll('.v-cur').forEach(c=>c.remove());
  document.querySelectorAll('.cell-ul').forEach(u=>u.classList.remove('active'));
  if(pos>=word.length)return;
  const top=document.getElementById('lc'+pos)?.parentElement;
  if(top){const cur=document.createElement('div');cur.className='v-cur';top.insertBefore(cur,top.firstChild);}
  const ul=document.getElementById('lu'+pos);if(ul)ul.classList.add('active');
}

function moveCursorSent(){
  document.querySelectorAll('.sv-cur').forEach(c=>c.remove());
  document.querySelectorAll('.sc-ul').forEach(u=>u.classList.remove('active'));
  if(pos>=mainRow._full.length)return;
  const sc=document.getElementById('sc'+pos)?.parentElement;
  if(sc){const cur=document.createElement('div');cur.className='sv-cur';sc.insertBefore(cur,sc.firstChild);}
  const ul=document.getElementById('su'+pos);if(ul)ul.classList.add('active');
}

function updateHeader(){
  document.getElementById('drill-prog-lbl').textContent=`Word ${wi+1} of ${wordList.length}`;
  document.getElementById('prog-lbl-inner').textContent=`Word ${wi+1} of ${wordList.length}`;
  document.getElementById('prog-fill').style.width=Math.round(wi/wordList.length*100)+'%';
}

function renderStage(){
  if(wi>=wordList.length){submitCompletion();return;}
  const{word,sentence}=wordList[wi];
  pos=0;mistakes=0;
  document.getElementById('stage-lbl').textContent=STAGE_LABELS[si];
  setFb('');
  updateHeader();
  renderDots();
  if(STAGES[si]==='sentence')buildSentenceRow(word,sentence);
  else buildWordRow(word,STAGES[si]);
  document.getElementById('drill-inner').focus();
}

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
document.getElementById('drill-inner').addEventListener('keydown',e=>{
  if(wi>=wordList.length)return;
  const{word}=wordList[wi];
  const stage=STAGES[si];

  if(stage==='sentence'){
    const full=mainRow._full,total=full.length;
    if(e.key==='Backspace'){
      e.preventDefault();
      if(pos>0){pos--;const sp=document.getElementById('sc'+pos);const isT=pos>=mainRow._ts&&pos<mainRow._te;if(sp){sp.className='sc-char '+(isT?'blank':'hint');sp.textContent=isT?'_':full[pos];}moveCursorSent();setFb('');}
      return;
    }
    if(e.key.length!==1||e.ctrlKey||e.metaKey||e.altKey)return;
    e.preventDefault();if(pos>=total)return;
    const isT=pos>=mainRow._ts&&pos<mainRow._te;
    const sp=document.getElementById('sc'+pos);
    if(e.key.toLowerCase()===full[pos].toLowerCase()){
      if(sp){sp.className='sc-char correct';sp.textContent=full[pos];}
      pos++;mistakes=0;setFb('');moveCursorSent();
      if(pos>=total){setFb('Perfect!','good');startCheer('Nailed it!');setTimeout(()=>{si=0;wi++;renderStage();},900);}
      else if(pos===mainRow._te)startCheer('Great spell!');
    } else {
      mistakes++;
      if(sp){const oc=sp.className;sp.className='sc-char wrong';sp.textContent=e.key;setTimeout(()=>{sp.className=oc;sp.textContent=isT?'_':full[pos];},280);}
      shakeRow();showSad();
      if(mistakes>=3)setFb(`Hint: "${full[pos]}"`, 'bad');
    }
    return;
  }

  const vis=getVis(word,stage);
  if(e.key==='Backspace'){
    e.preventDefault();
    if(pos>0){pos--;const ch=document.getElementById('lc'+pos);if(ch){ch.className='cell-char '+(vis[pos]?'hint':'blank');ch.textContent=vis[pos]?word[pos]:'_';}moveCursorWord(word);setFb('');}
    return;
  }
  if(e.key.length!==1||e.ctrlKey||e.metaKey||e.altKey)return;
  e.preventDefault();if(pos>=word.length)return;
  const ch=document.getElementById('lc'+pos);
  if(e.key.toLowerCase()===word[pos].toLowerCase()){
    if(ch){ch.className='cell-char correct';ch.textContent=word[pos];}
    pos++;mistakes=0;setFb('');moveCursorWord(word);
    if(pos>=word.length){setFb('Nice!','good');startCheer(si===2?'Perfect!':'Keep going!');setTimeout(()=>{si++;renderStage();},700);}
  } else {
    mistakes++;
    if(ch){ch.className='cell-char wrong';ch.textContent=e.key;setTimeout(()=>{ch.className='cell-char '+(vis[pos]?'hint':'blank');ch.textContent=vis[pos]?word[pos]:'_';},280);}
    shakeRow();showSad();
    if(mistakes>=3)setFb(`Hint: "${word[pos]}"`, 'bad');
  }
});

// ── COMPLETION & SUBMISSION ───────────────────────────────────────────────────
function submitCompletion(){
  show('complete');
  startCheer('You did it!');

  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit'});
  const timeStr = now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

  document.getElementById('complete-msg').textContent =
    `You drilled ${wordList.length} word${wordList.length!==1?'s':''} from your blog entry. Great work!`;
  document.getElementById('complete-sub').textContent =
    `Completed ${dateStr} at ${timeStr}`;

  // Post to Google Sheet
  const payload = {
    action:      'spellingDrill',
    studentNum:  studentNum,
    studentName: studentName,
    class:       studentClass,
    wordsCount:  wordList.length,
    words:       wordList.map(w=>w.word).join(', '),
    timestamp:   now.toISOString(),
    completed:   true
  };

  fetch(SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  }).catch(()=>{}); // silent fail — completion is shown regardless
}
</script>
